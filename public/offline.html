<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline - F1 Picks</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100vh;
        margin: 0;
        padding: 20px;
        color: #333;
        background-color: #f5f5f5;
      }
      .container {
        max-width: 500px;
      }
      h1 {
        color: #FF7800;
        margin-bottom: 10px;
      }
      p {
        margin-bottom: 20px;
        line-height: 1.5;
      }
      .icon {
        font-size: 64px;
        margin-bottom: 20px;
      }
      .button {
        background-color: #FF7800;
        color: white;
        border: none;
        padding: 12px 24px;
        border-radius: 4px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .button:hover {
        background-color: #E56C00;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon">🏎️</div>
      <h1>You're Offline</h1>
      <p>
        Sorry, you're currently offline and we can't load the latest F1 picks data.
        Please check your connection and try again.
      </p>
      <button class="button" onclick="window.location.reload()">Try Again</button>
    </div>
  </body>
</html>
